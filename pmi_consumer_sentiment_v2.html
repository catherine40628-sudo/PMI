function buildChart() {
  const canvas = document.getElementById('pmiChart');
  new Chart(canvas.getContext('2d'), {
    data:{
      labels: LABELS,
      datasets:[
        { type:'line', label:'製造業 PMI', data:mfgData, borderColor:'#1a56c4', backgroundColor:'rgba(26,86,196,0.07)', borderWidth:2.5, pointRadius:0, tension:0.2, fill:false, yAxisID:'y', order:2 },
        { type:'line', label:'服務業 PMI', data:svcData, borderColor:'#1a56c4', backgroundColor:'transparent', borderWidth:2, borderDash:[5,4], pointRadius:0, tension:0.2, fill:false, yAxisID:'y', order:3 },
        { type:'line', label:'榮枯線 50', data:fifty, borderColor:'#111', backgroundColor:'transparent', borderWidth:1, borderDash:[3,3], pointRadius:0, tension:0, fill:false, yAxisID:'y', order:4 },
        { type:'line', label:'消費者信心', data:sentData, borderColor:'#aaa', backgroundColor:'rgba(180,180,180,0.08)', borderWidth:2.5, pointRadius:0, tension:0.2, fill:false, yAxisID:'y2', order:1 },
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{enabled:false} },
      scales:{
        x:{ ticks:{ autoSkip:true, maxTicksLimit:12, maxRotation:0, color:'#888', font:{size:13}, callback:(v,i)=> LABELS[i]&&LABELS[i].endsWith('-01')?LABELS[i].slice(0,4):'' }, grid:{color:'rgba(0,0,0,0.05)'} },
        y:{ position:'left', min:35, max:75, ticks:{color:'#888', font:{size:13}}, grid:{color:'rgba(0,0,0,0.05)'}, title:{display:true, text:'PMI', color:'#1a56c4', font:{size:12}} },
        y2:{ position:'right', min:40, max:115, ticks:{color:'#888', font:{size:13}}, grid:{display:false}, title:{display:true, text:'消費者信心', color:'#888', font:{size:12}} }
      },
      animation:false,
      onHover:(e, els, chart)=>{
        const tt = document.getElementById('tt');
        if(!els.length){ tt.style.display='none'; return; }
        const i = els[0].index;
        const lbl = LABELS[i];
        const rect = chart.canvas.parentElement.getBoundingClientRect();
        let x = e.native.clientX - rect.left + 14;
        let y = e.native.clientY - rect.top - 40;
        if(x > rect.width-260) x -= 280;
        if(y < 0) y = 8;
        const matched = EVENTS.filter(ev=>ev.month===lbl);
        const evHTML = matched.map(ev=>`
          <div style="margin-top:9px;padding:8px 10px;border-left:3px solid ${TAG_COLOR[ev.tag]};background:${TAG_BG[ev.tag]};">
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:${TAG_COLOR[ev.tag]};margin-bottom:3px;">${TAG_LABEL[ev.tag]}</div>
            <div style="font-weight:600;font-size:13px;color:#111;margin-bottom:3px;">${ev.label}</div>
            <div style="font-size:12px;color:#444;line-height:1.55;">${ev.desc}</div>
          </div>`).join('');
        tt.innerHTML=`
          <div style="font-size:13px;font-weight:600;color:#111;border-bottom:1px solid #e0e0e0;padding-bottom:6px;margin-bottom:4px;">${lbl}</div>
          <div style="font-size:12px;color:#555;line-height:1.8;">
            製造業 PMI：<span style="color:#1a56c4;font-weight:600">${mfgData[i]??'—'}</span><br>
            服務業 PMI：<span style="color:#1a56c4;font-weight:600;opacity:.7">${svcData[i]??'—'}</span><br>
            消費者信心：<span style="color:#888;font-weight:600">${sentData[i]??'—'}</span>
          </div>${evHTML||''}`;
        tt.style.display='block';
        tt.style.left=x+'px'; tt.style.top=y+'px';
      }
    }
  });
  document.getElementById('pmiChart').addEventListener('mouseleave',()=>{ document.getElementById('tt').style.display='none'; });
}

function renderPanel(filter){
  const panel = document.getElementById('eventPanel');
  const list = filter==='all' ? EVENTS : EVENTS.filter(e=>e.tag===filter);
  panel.innerHTML = list.map(e=>`
    <div class="card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <span class="tag-pill" style="background:${TAG_COLOR[e.tag]}">${TAG_LABEL[e.tag]}</span>
        <span style="font-size:12px;color:#999;">${e.month}</span>
      </div>
      <div style="font-size:14px;font-weight:600;color:#111;margin-bottom:4px;">${e.label}</div>
      <div style="font-size:13px;color:#555;line-height:1.6;">${e.desc}</div>
    </div>`).join('');
}

function filterEvents(tag,btn){
  currentFilter=tag;
  document.querySelectorAll('.evt-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderPanel(tag);
}

buildChart();
renderPanel('all');
</script>
